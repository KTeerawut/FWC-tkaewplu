<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <td style="background-color: lightgreen;">
            First cell
        </td>

        <td style="background-color: lightpink;">
            Second cell
        </td>
    </tr>
</table>

</body>
</html>
