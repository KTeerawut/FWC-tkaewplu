<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

    <form id="calcForm">
        <input type="text" id="left">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="right">

        <input type="submit" value="Try me!">
    </form>

    <script src="calc.js"></script>
</body>
</html>
